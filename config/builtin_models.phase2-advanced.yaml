# AlphaMind 第二阶段内置模型配置
#
# 由 docker-compose.phase2-advanced.yml 挂载到 /app/config/builtin_models.yaml。
# 敏感值从 .env.phase2-advanced 注入；不要把真实 API key 写入本文件。
#
# 第二阶段使用 OpenAI-compatible 模型服务：Qwen + Embedding + Rerank，用于 PDF/GraphRAG 抽取、检索与问答。

builtin_models:
  - id: alphamind-llm-default
    type: KnowledgeQA
    source: remote
    is_default: true
    name: ${LLM_MODEL_NAME}
    description: AlphaMind 第二阶段 Qwen 投研问答与图谱抽取模型（OpenAI-compatible）
    parameters:
      base_url: ${LLM_BASE_URL}
      api_key: ${LLM_API_KEY}
      provider: ${LLM_PROVIDER}

  - id: alphamind-embedding-default
    type: Embedding
    source: remote
    is_default: true
    name: ${EMBEDDING_MODEL_NAME}
    description: AlphaMind 第二阶段向量化模型（OpenAI-compatible）
    parameters:
      base_url: ${EMBEDDING_BASE_URL}
      api_key: ${EMBEDDING_API_KEY}
      provider: ${EMBEDDING_PROVIDER}
      embedding_parameters:
        dimension: ${EMBEDDING_DIMENSION}
        truncate_prompt_tokens: ${EMBEDDING_TRUNCATE_PROMPT_TOKENS}
        supports_dimension_override: true

  - id: alphamind-rerank-default
    type: Rerank
    source: remote
    is_default: true
    name: ${RERANK_MODEL_NAME}
    description: AlphaMind 第二阶段金融投研重排模型
    parameters:
      base_url: ${RERANK_BASE_URL}
      api_key: ${RERANK_API_KEY}
      provider: ${RERANK_PROVIDER}

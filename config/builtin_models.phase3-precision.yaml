# AlphaMind Phase3 precision models. Secrets are injected from .env.phase3-precision.
builtin_models:
  - id: alphamind-llm-default
    type: KnowledgeQA
    source: remote
    is_default: true
    name: ${LLM_MODEL_NAME}
    description: AlphaMind Phase3 financial QA and graph extraction model
    parameters:
      base_url: ${LLM_BASE_URL}
      api_key: ${LLM_API_KEY}
      provider: ${LLM_PROVIDER}

  - id: alphamind-embedding-default
    type: Embedding
    source: remote
    is_default: true
    name: ${EMBEDDING_MODEL_NAME}
    description: AlphaMind Phase3 dense financial embedding model
    parameters:
      base_url: ${EMBEDDING_BASE_URL}
      api_key: ${EMBEDDING_API_KEY}
      provider: ${EMBEDDING_PROVIDER}
      embedding_parameters:
        dimension: ${EMBEDDING_DIMENSION}
        truncate_prompt_tokens: ${EMBEDDING_TRUNCATE_PROMPT_TOKENS}
        supports_dimension_override: true

  - id: alphamind-rerank-default
    type: Rerank
    source: remote
    is_default: true
    name: ${RERANK_MODEL_NAME}
    description: AlphaMind Phase3 financial reranker
    parameters:
      base_url: ${RERANK_BASE_URL}
      api_key: ${RERANK_API_KEY}
      provider: ${RERANK_PROVIDER}
